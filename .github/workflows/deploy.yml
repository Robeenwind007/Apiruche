name: Déploiement VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoyer les fichiers sur le VPS
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude 'cron-alertes*.js' \
            ./ deploy@${{ secrets.VPS_HOST }}:/srv/kgb/sites/apiruche/
